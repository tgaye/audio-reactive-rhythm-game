<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Reactive Rhythm Game</title>
    <!-- Google Font properly included in head -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/addons/p5.sound.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Press Start 2P', Arial, sans-serif;
        }
        #fileInput {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            color: white;
        }
        #instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            z-index: 100;
            background-color: rgba(0,0,0,0.7);
            padding: 20px;
            border-radius: 10px;
            max-width: 80%;
        }
        #startButton {
            padding: 10px 20px;
            margin-top: 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Press Start 2P', Arial, sans-serif;
            font-size: 16px;
            display: none;
        }
    </style>
</head>
<body>
    <input type="file" id="fileInput" accept="audio/*">
    <div id="instructions">
        <p>Upload an audio file to begin</p>
        <button id="startButton">START GAME</button>
    </div>

    <script>
        let soundFile;
        let fft;
        let beatDetect;
        let targets = [];
        let particles = [];
        let score = 0;
        let combo = 0;
        let maxCombo = 0;
        let gameState = 'waiting';
        let lastBeatTime = 0;
        let beatInterval = 500;
        let spectrumHistory = [];
        let bgColor = 0;
        let hitEffects = [];
        let audioLoaded = false;
        let audioInitialized = false;
    
        function setup() {
            createCanvas(windowWidth, windowHeight);
            colorMode(HSB, 360, 100, 100, 1);
            noStroke();
            textAlign(CENTER, CENTER);
            
            // Set up file input
            document.getElementById('fileInput').addEventListener('change', handleFile);
            document.getElementById('startButton').addEventListener('click', startGame);
            
            // We don't set up audio analysis yet - wait for user interaction
        }
    
        // Initialize audio contexts only after user interaction
        function initializeAudio() {
            if (audioInitialized) return;
            
            try {
                // Start audio context
                if (getAudioContext().state !== 'running') {
                    getAudioContext().resume();
                }
                
                // Set up audio analysis
                fft = new p5.FFT(0.8, 64);
                beatDetect = new p5.PeakDetect(40, 20000, 0.35, 20);
                
                audioInitialized = true;
                console.log("Audio context initialized successfully");
            } catch (e) {
                console.error("Failed to initialize audio:", e);
                document.getElementById('instructions').innerHTML = 
                    "Error initializing audio. Please try again or use a different browser.";
            }
        }
    
        function handleFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const startButton = document.getElementById('startButton');
            document.getElementById('instructions').innerHTML = 
                "<p>Loading audio file...</p>";
            
            // Initialize audio on first file upload
            initializeAudio();
            
            try {
                const url = URL.createObjectURL(file);
                
                // Load sound file
                loadSound(url, 
                    // Success callback
                    function(loadedSound) {
                        soundFile = loadedSound;
                        audioLoaded = true;
                        gameState = 'ready';
                        
                        document.getElementById('instructions').innerHTML = 
                            `<p>Audio loaded: ${file.name}</p>`;
                        startButton.style.display = 'inline-block';
                        console.log("Audio file loaded successfully");
                    },
                    // Error callback
                    function(err) {
                        console.error("Error loading sound file:", err);
                        document.getElementById('instructions').innerHTML = 
                            `<p>Error loading audio file. Please try another file.</p>`;
                    }
                );
            } catch (err) {
                console.error("Error creating object URL:", err);
                document.getElementById('instructions').innerHTML = 
                    "<p>Error processing audio file. Please try again.</p>";
            }
        }
    
        function startGame() {
            if (!audioLoaded || !audioInitialized) {
                console.warn("Cannot start game: audio not ready");
                return;
            }
            
            gameState = 'playing';
            soundFile.play();
            document.getElementById('instructions').style.display = 'none';
        }
    
        function draw() {
            background(bgColor, 100, 10, 1);
            
            if (gameState === 'playing') {
                updateAudioAnalysis();
                updateTargets();
                updateParticles();
                updateHitEffects();
                drawSpectrum();
            }
            
            drawTargets();
            drawParticles();
            drawHitEffects();
            drawUI();
            
            // Fade background color
            bgColor = (bgColor + 0.2) % 360;
        }
    
        function updateAudioAnalysis() {
            if (!fft || !beatDetect) return;
            
            fft.analyze();
            beatDetect.update(fft);
            
            if (beatDetect.isDetected) {
                lastBeatTime = millis();
                createTarget();
                
                // Adjust beat interval dynamically
                if (targets.length > 10) {
                    beatInterval = max(200, beatInterval * 0.98);
                }
            }
            
            // Store spectrum for visualization
            let spectrum = fft.analyze();
            spectrumHistory.push(spectrum);
            if (spectrumHistory.length > 30) {
                spectrumHistory.shift();
            }
        }
    
        function createTarget() {
            // Limit maximum targets for performance
            if (targets.length >= 25) return;
            
            let size = random(30, 80);
            let x = random(size, width - size);
            let y = random(size, height - size);
            let hue = random(360);
            let life = 60; // frames until target disappears
            
            targets.push({
                x: x,
                y: y,
                size: size,
                maxSize: size * 1.5,
                minSize: size * 0.7,
                hue: hue,
                life: life,
                maxLife: life,
                hit: false,
                perfect: false,
                spawnTime: millis()
            });
        }
    
        function updateTargets() {
            for (let i = targets.length - 1; i >= 0; i--) {
                let target = targets[i];
                
                // Pulsing animation
                let pulse = sin(frameCount * 0.1) * 0.2 + 0.8;
                target.size = map(pulse, 0, 1, target.minSize, target.maxSize);
                
                // Lifetime management
                target.life--;
                if (target.life <= 0) {
                    if (!target.hit) {
                        combo = 0;
                        createMissEffect(target.x, target.y);
                    }
                    targets.splice(i, 1);
                }
            }
        }
    
        function updateParticles() {
            // Limit maximum particles for performance
            if (particles.length > 500) {
                particles.splice(0, particles.length - 500);
            }
            
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 2;
                p.size *= 0.95;
                
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }
    
        function updateHitEffects() {
            for (let i = hitEffects.length - 1; i >= 0; i--) {
                let effect = hitEffects[i];
                effect.size += 2;
                effect.alpha -= 3;
                
                if (effect.alpha <= 0) {
                    hitEffects.splice(i, 1);
                }
            }
        }
    
        function drawTargets() {
            for (let target of targets) {
                if (!target.hit) {
                    fill(target.hue, 80, 90, 0.8);
                    ellipse(target.x, target.y, target.size);
                    
                    // Inner circle
                    fill(target.hue, 50, 100, 0.9);
                    ellipse(target.x, target.y, target.size * 0.7);
                    
                    // Highlight
                    fill(target.hue, 30, 100, 0.6);
                    ellipse(target.x - target.size * 0.15, target.y - target.size * 0.15, target.size * 0.3);
                }
            }
        }
    
        function drawParticles() {
            for (let p of particles) {
                fill(p.hue, p.saturation, p.brightness, p.alpha / 255);
                ellipse(p.x, p.y, p.size);
            }
        }
    
        function drawHitEffects() {
            for (let effect of hitEffects) {
                noFill();
                stroke(effect.hue, 80, 100, effect.alpha / 255);
                strokeWeight(2);
                ellipse(effect.x, effect.y, effect.size);
                
                // Draw accuracy text
                if (effect.alpha > 100) {
                    noStroke();
                    fill(effect.hue, 80, 100, effect.alpha / 255);
                    textSize(16);
                    text(effect.accuracy, effect.x, effect.y - effect.size / 2 - 10);
                }
            }
        }
    
        function drawSpectrum() {
            if (!spectrumHistory || spectrumHistory.length < 2) return;
            
            let latestSpectrum = spectrumHistory[spectrumHistory.length - 1];
            let segmentWidth = width / latestSpectrum.length;
            
            noStroke();
            for (let i = 0; i < latestSpectrum.length; i++) {
                let value = latestSpectrum[i];
                let h = map(value, 0, 255, 0, height * 0.3);
                let hue = map(i, 0, latestSpectrum.length, 0, 360);
                
                fill(hue, 70, 70, 0.3);
                rect(i * segmentWidth, height - h, segmentWidth, h);
            }
        }
    
        function drawUI() {
            // Score display
            fill(0, 0, 100);
            textSize(24);
            text(`Score: ${score}`, 100, 40);
            
            // Combo display
            if (combo > 0) {
                let comboAlpha = map(combo, 0, 50, 100, 255, true);
                let comboSize = map(combo, 0, 50, 30, 60, true);
                fill(120, 100, 100, comboAlpha / 255);
                textSize(comboSize);
                text(`COMBO ${combo}`, width / 2, 100);
            }
            
            // Max combo
            fill(0, 0, 100, 0.7);
            textSize(18);
            text(`Max Combo: ${maxCombo}`, width - 120, 40);
            
            // Game state messages
            if (gameState === 'waiting' && !audioLoaded) {
                fill(0, 0, 100);
                textSize(18);
                text("No audio loaded", width / 2, height - 40);
            }
        }
    
        function mousePressed() {
            // First click anywhere should initialize audio
            if (!audioInitialized) {
                initializeAudio();
            }
            
            if (gameState !== 'playing') return;
            
            for (let i = targets.length - 1; i >= 0; i--) {
                let target = targets[i];
                let d = dist(mouseX, mouseY, target.x, target.y);
                
                if (d < target.size / 2 && !target.hit) {
                    target.hit = true;
                    let hitTime = millis() - target.spawnTime;
                    let accuracy;
                    
                    if (hitTime < 50) {
                        accuracy = "PERFECT";
                        score += 100;
                        target.perfect = true;
                    } else if (hitTime < 100) {
                        accuracy = "GREAT";
                        score += 50;
                    } else if (hitTime < 150) {
                        accuracy = "GOOD";
                        score += 20;
                    } else {
                        accuracy = "POOR";
                        score += 5;
                    }
                    
                    combo++;
                    maxCombo = max(combo, maxCombo);
                    createHitEffect(target.x, target.y, target.hue, accuracy);
                    createParticles(target.x, target.y, target.hue, target.size);
                    break;
                }
            }
        }
    
        function createHitEffect(x, y, hue, accuracy) {
            hitEffects.push({
                x: x,
                y: y,
                size: 10,
                hue: hue,
                alpha: 200,
                accuracy: accuracy
            });
            
            // Bigger effect for perfect hits
            if (accuracy === "PERFECT") {
                hitEffects.push({
                    x: x,
                    y: y,
                    size: 30,
                    hue: (hue + 180) % 360,
                    alpha: 150,
                    accuracy: accuracy
                });
            }
        }
    
        function createParticles(x, y, hue, size) {
            let particleCount = min(map(size, 30, 80, 10, 30), 30); // Limit for performance
            
            for (let i = 0; i < particleCount; i++) {
                let angle = random(TWO_PI);
                let speed = random(1, 3);
                let sat = random(70, 100);
                let bright = random(80, 100);
                let particleHue = (hue + random(-30, 30)) % 360;
                
                particles.push({
                    x: x,
                    y: y,
                    vx: cos(angle) * speed,
                    vy: sin(angle) * speed,
                    size: random(5, 15),
                    hue: particleHue,
                    saturation: sat,
                    brightness: bright,
                    alpha: 255
                });
            }
        }
    
        function createMissEffect(x, y) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: random(-2, 2),
                    vy: random(-2, 2),
                    size: random(3, 8),
                    hue: 0,
                    saturation: 0,
                    brightness: 50,
                    alpha: 150
                });
            }
        }
    
        function keyPressed() {
            // First keypress should initialize audio
            if (!audioInitialized) {
                initializeAudio();
            }
            
            if (key === ' ' && gameState === 'ready' && audioLoaded) {
                startGame();
            } else if (key === 'p' || keyCode === ESCAPE) {
                // Pause/resume functionality
                if (gameState === 'playing') {
                    gameState = 'paused';
                    if (soundFile && soundFile.isPlaying()) {
                        soundFile.pause();
                    }
                    document.getElementById('instructions').innerHTML = 
                        "<p>PAUSED</p><p>Press P or ESC to resume</p>";
                    document.getElementById('instructions').style.display = 'block';
                } else if (gameState === 'paused') {
                    gameState = 'playing';
                    if (soundFile) {
                        soundFile.play();
                    }
                    document.getElementById('instructions').style.display = 'none';
                }
            }
        }
    
        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    
        // Initial setup for touch devices
        window.addEventListener('touchstart', function() {
            if (!audioInitialized) {
                initializeAudio();
            }
        });
    </script>


</body></html>
